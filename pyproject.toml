[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "muse-cost"
version = "0.1.0"
description = "Local Muse usage collector and live browser dashboard"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
muse-cost = "meta_cost_center.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meta_cost_center = ["pricing.json", "web/*.html", "web/*.css", "web/*.js", "web/*.png"]
